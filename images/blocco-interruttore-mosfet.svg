<rect x="452" y="330" width="16" height="50" fill="#fff" stroke="#222" stroke-width="2.5"/>
<text x="476" y="360" font-size="14" fill="#222" text-anchor="start" font-weight="normal">F1 PTC 1,85 A</text>
<polyline points="460,380 460,420" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
