<line x1="558" y1="450" x2="582" y2="450" stroke="#222" stroke-width="3"/><polygon points="558,474 582,474 570,452" fill="#fff" stroke="#222" stroke-width="2.5"/>
<polyline points="570,474 570,500" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g stroke="#222" stroke-width="2.5"><line x1="570" y1="500" x2="570" y2="508"/><line x1="558" y1="508" x2="582" y2="508"/><line x1="562" y1="513" x2="578" y2="513"/><line x1="566" y1="518" x2="574" y2="518"/></g>
<text x="590" y="466" font-size="14" fill="#222" text-anchor="start" font-weight="normal">D2 TVS 5 V (SMBJ5.0A)</text>
<rect x="760" y="375" width="190" height="120" rx="8" fill="#fce4ec" stroke="#555" stroke-width="2"/>
<text x="855" y="399" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Cavetto USB corto</text>
<text x="855" y="419" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">Pi 3A+</text>
<text x="855" y="436" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">(conduttori da 24 AWG)</text>
<text x="766" y="424" font-size="13" fill="#e65100" text-anchor="start" font-weight="normal">+5 V</text>
<text x="766" y="474" font-size="13" fill="#333" text-anchor="start" font-weight="normal">GND</text>
<polyline points="760,470 730,470 730,520" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g stroke="#222" stroke-width="2.5"><line x1="730" y1="520" x2="730" y2="528"/><line x1="718" y1="528" x2="742" y2="528"/><line x1="722" y1="533" x2="738" y2="533"/><line x1="726" y1="538" x2="734" y2="538"/></g>
<text x="1000" y="110" font-size="16" fill="#222" text-anchor="start" font-weight="bold">Come funziona</text>
<text x="1000" y="134" font-size="13" fill="#333" text-anchor="start" font-weight="normal">P1 basso (o flottante): il BC547 è spento, R1 tiene il gate al source</text>
<text x="1000" y="154" font-size="13" fill="#333" text-anchor="start" font-weight="normal">→ AO3401 spento → la Pi non ha tensione (stato sicuro all'avvio).</text>
<text x="1000" y="174" font-size="13" fill="#333" text-anchor="start" font-weight="normal">P1 alto: il BC547 conduce, il gate scende verso massa (Vgs ≈ −4,7 V)</text>
<text x="1000" y="194" font-size="13" fill="#333" text-anchor="start" font-weight="normal">→ AO3401 acceso → +5,1 V alla Pi attraverso F1.</text>
<text x="1000" y="214" font-size="13" fill="#333" text-anchor="start" font-weight="normal">C1 (10 nF) rallenta l'accensione: avvio morbido dello spunto.</text>
<text x="1000" y="262" font-size="16" fill="#222" text-anchor="start" font-weight="bold">Piedinatura (controlla sempre la scheda tecnica)</text>
<text x="1000" y="286" font-size="13" fill="#333" text-anchor="start" font-weight="normal">AO3401 (SOT-23), vista dall'alto: pin 1 = Gate, pin 2 = Source, pin 3 = Drain.</text>
<text x="1000" y="306" font-size="13" fill="#333" text-anchor="start" font-weight="normal">BC547 (TO-92), lato piatto verso di te, da sinistra: C – B – E.</text>
<text x="1000" y="345" font-size="16" fill="#222" text-anchor="start" font-weight="bold">Per la prova</text>
<text x="1000" y="369" font-size="13" fill="#333" text-anchor="start" font-weight="normal">Carico di prova: resistenza 5,1 Ω / 5 W (circa 1 A) al posto della Pi.</text>
<text x="1000" y="389" font-size="13" fill="#333" text-anchor="start" font-weight="normal">Misura: tensione sul carico (deve restare sopra 4,9 V),</text>
<text x="1000" y="409" font-size="13" fill="#333" text-anchor="start" font-weight="normal">temperatura dell'AO3401 (tiepido) e che con P1 basso sia 0 V.</text>
<text x="40" y="640" font-size="13" fill="#333" text-anchor="start" font-weight="normal">Con P1 flottante (ATtiny in reset o bootloader) R4 tiene il BC547 spento: la Pi non si accende da sola.</text>
<text x="40" y="660" font-size="13" fill="#333" text-anchor="start" font-weight="normal">Il diodo TVS D2 e il fusibile F1 stanno dopo il MOSFET, sul lato verso la Pi.</text>
</svg>