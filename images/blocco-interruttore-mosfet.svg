<text x="40" y="34" font-size="22" fill="#222" text-anchor="start" font-weight="bold">Interruttore MOSFET per alimentare la Raspberry Pi (al posto del relè)</text>
<text x="40" y="54" font-size="14" fill="#555" text-anchor="start" font-weight="normal">Interruttore sul lato positivo (high-side): P1 ALTO = Pi accesa, come con il relè. La massa non si interrompe.</text>
