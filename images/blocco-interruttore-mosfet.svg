<text x="465" y="214" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">P-MOSFET</text>
<text x="465" y="231" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">logic level</text>
<text x="406" y="229" font-size="12" fill="#333" text-anchor="start" font-weight="normal">G</text>
<text x="476" y="164" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">S</text>
<text x="470" y="280" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">D</text>
<polyline points="460,130 460,170" fill="none" stroke="#e65100" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="460" cy="130" r="5" fill="#e65100"/>
<polyline points="200,225 200,300" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="192" y="300" width="16" height="50" fill="#fff" stroke="#222" stroke-width="2.5"/>
<text x="216" y="330" font-size="14" fill="#222" text-anchor="start" font-weight="normal">R2 220 Ω</text>
<polyline points="200,350 200,400" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="150" y="400" width="110" height="85" rx="8" fill="#e8eaf6" stroke="#555" stroke-width="2"/>
<text x="205" y="424" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">BC547</text>
<text x="205" y="444" font-size="12" fill="#444" text-anchor="middle" font-weight="normal">NPN</text>
<text x="212" y="394" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">C</text>
<text x="156" y="459" font-size="12" fill="#333" text-anchor="start" font-weight="normal">B</text>
<text x="205" y="480" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">E</text>
<polyline points="200,485 200,505" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g stroke="#222" stroke-width="2.5"><line x1="200" y1="505" x2="200" y2="513"/><line x1="188" y1="513" x2="212" y2="513"/><line x1="192" y1="518" x2="208" y2="518"/><line x1="196" y1="523" x2="204" y2="523"/></g>
<text x="40" y="410" font-size="14" fill="#6a1b9a" text-anchor="start" font-weight="bold">P1 (Digispark)</text>
<polyline points="40,455 70,455" fill="none" stroke="#6a1b9a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="70" y="447" width="50" height="16" fill="#fff" stroke="#222" stroke-width="2.5"/>
<text x="95" y="441" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">R3 4,7 kΩ</text>
<polyline points="120,455 150,455" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="135" cy="455" r="5" fill="#222"/>
<polyline points="135,455 135,480" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="127" y="480" width="16" height="50" fill="#fff" stroke="#222" stroke-width="2.5"/>
<text x="119" y="510" font-size="14" fill="#222" text-anchor="end" font-weight="normal">R4 100 kΩ</text>
<polyline points="135,530 135,550" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g stroke="#222" stroke-width="2.5"><line x1="135" y1="550" x2="135" y2="558"/><line x1="123" y1="558" x2="147" y2="558"/><line x1="127" y1="563" x2="143" y2="563"/><line x1="131" y1="568" x2="139" y2="568"/></g>
